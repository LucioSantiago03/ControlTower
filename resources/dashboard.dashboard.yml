# O dashboard do Projeto Farol, como código: o JSON sai de scripts/gerar_dashboard.py.
# As queries da gold usam o nome puro da tabela, e o catálogo e o schema vêm daqui.
resources:
  dashboards:
    dashboard_portfolio:
      display_name: "Projeto Farol · Portfólio"
      file_path: ./dashboard-portfolio.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
